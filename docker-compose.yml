services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eve_healthcare
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: eve_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U eve_user -d eve_healthcare" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://eve_user:eve_password@postgres:5432/eve_healthcare?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "npx", "prisma", "migrate", "deploy" ]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: postgresql://eve_user:eve_password@postgres:5432/eve_healthcare?schema=public

      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-please}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      REDIS_URL: redis://redis:6379

      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      AUTH_RATE_LIMIT_MAX: 10
      PAYMENT_RATE_LIMIT_MAX: 20

      CACHE_TTL_CENTRES: 300
      CACHE_TTL_TESTS: 300

      CORS_ORIGIN: ${CORS_ORIGIN:-*}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
